name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment to apply
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
        default: minor

permissions:
  contents: write

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version files
        run: |
          set -euo pipefail

          BUMP="${{ inputs.bump }}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEXT_VERSION=$(node -e "const current = process.argv[1]; const bump = process.argv[2]; const parts = current.split('.').map(Number); if (parts.length !== 3 || parts.some(Number.isNaN)) { throw new Error('Invalid current version'); } let next; if (bump === 'major') { next = [parts[0] + 1, 0, 0]; } else if (bump === 'minor') { next = [parts[0], parts[1] + 1, 0]; } else if (bump === 'patch') { next = [parts[0], parts[1], parts[2] + 1]; } else { throw new Error('Invalid version bump'); } process.stdout.write(next.join('.'));" "$CURRENT_VERSION" "$BUMP")

          npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version

          node <<'NODE'
          const fs = require('fs');

          const nextVersion = require('./package.json').version;

          const manifestPath = './manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.version = nextVersion;
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);

          const readmePath = './README.md';
          const readme = fs.readFileSync(readmePath, 'utf8');
          const updated = readme.replace(/(\*\*Version:\*\*\s*)\d+\.\d+\.\d+/, `$1${nextVersion}`);
          if (updated === readme) {
            throw new Error('README version marker not found');
          }
          fs.writeFileSync(readmePath, updated);
          NODE

      - name: Commit version bump
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json README.md
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git push origin HEAD:${{ github.ref_name }}